<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختبار تأسيس اللغة الإنجليزية وتمكين الأبطال</title>

    <style>

        :root {

            --primary-blue: #273c75;
            --accent-gold: #fbc531;
            --success-green: #44bd32;
            --error-red: #c23616;
            --white: #ffffff;
            --wa-green: #25D366;

        }

        body {

            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #192a56 0%, #273c75 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

        }

        #main-container {

            background: white;
            width: 100%;
            max-width: 700px;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border-top: 10px solid var(--accent-gold);
            text-align: center;

        }

        .platform-name {

            background: linear-gradient(90deg, #273c75, #192a56);
            color: white;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);

        }

        h1 {

            color: var(--primary-blue);
            margin-bottom: 5px;
            font-size: 1.8rem;

        }

        .subtitle {

            color: var(--accent-gold);
            font-weight: bold;
            margin-bottom: 25px;

        }

        .progress-bar-bg {

            background: #dcdde1;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;

        }

        #progress-fill {

            background: var(--accent-gold);
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;

        }

        .question-container {

            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.7;
            color: var(--primary-blue);
            min-height: 70px;

        }

        .options-list {

            display: grid;
            gap: 12px;

        }

        .option-btn {

            padding: 16px;
            border: 2px solid #dcdde1;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: right;
            transition: 0.3s;
            color: var(--primary-blue);

        }

        .option-btn:hover:not(:disabled) {

            background: #f5f6fa;
            border-color: var(--primary-blue);

        }

        .is-correct {

            background: var(--success-green) !important;
            color: white !important;
            border-color: var(--success-green) !important;

        }

        .is-wrong {

            background: var(--error-red) !important;
            color: white !important;
            border-color: var(--error-red) !important;

        }

        #info-box {

            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #f5f6fa;
            border-right: 5px solid var(--primary-blue);
            text-align: right;
            line-height: 1.7;

        }

        #final-screen {

            display: none;

        }

        .score-display {

            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-blue);
            margin: 20px 0;

        }

        input {

            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #dcdde1;
            margin-bottom: 20px;
            font-size: 1rem;
            text-align: center;
            box-sizing: border-box;

        }

        .whatsapp-link {

            background: var(--wa-green);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;

        }

        .whatsapp-link:hover {

            transform: translateY(-2px);
            opacity: 0.95;

        }
        
        .english-embed {
            font-family: 'Arial', sans-serif;
            color: #c23616;
            font-size: 1.3rem;
            background: #ebf8ff;
            padding: 2px 8px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div id="main-container">

    <div class="platform-name">

        منصة البرامج التخصصية | إدارة محمد طه عطا المنان

    </div>

    <div id="quiz-ui">

        <h1>📘 اختبار خطة التمكين والتمتير اللغوي</h1>

        <div class="subtitle">

            الوعي الصوتي (Phonics) • الدمج الصوتي • قراءة الجمل المستقلة

        </div>

        <div class="progress-bar-bg">

            <div id="progress-fill"></div>

        </div>

        <div id="question-text" class="question-container">

            جاري تحميل الأسئلة التمكينية...

        </div>

        <div id="options-box" class="options-list"></div>

        <div id="info-box"></div>

    </div>

    <div id="final-screen">

        <div class="score-display" id="total-score">0</div>

        <h2>رائع جداً يا أبطال 👏 لقد أكملتم التحدي بنجاح</h2>

        <p>الرجاء كتابة اسم البطل الثلاثي لإرسال النتيجة الفنية مباشرة للإدارة:</p>

        <input type="text" id="user-name" placeholder="اكتب اسم البطل هنا">

        <button class="whatsapp-link" onclick="handleWhatsApp()">

            إرسال التقارير والنتيجة عبر واتساب

        </button>

    </div>

</div>

<audio id="successSound" preload="auto">

    <source src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" type="audio/mpeg">

</audio>

<script>

// تم تحديث المصفوفة لتعالج المشاكل اللغوية المحددة بدقة (الصوتيات، الدمج، وقراءة الجمل)
// وتم توجيه الشروحات للمتدربين كافة (صيغة الجمع)
const questions = [

{
    q: "عند قراءة الكلمات، ما هو الصوت الحقيقي الحركي لحرف (A) السحري؟",
    a: [
        "/æ/ مثل صوت بداية كلمة Apple",
        "اسمه التقليدي (إيه)",
        "/بـ/ مثل صوت البدء في Ball",
        "/تـ/ مثل صوت البدء في Cat"
    ],
    c: 0,
    exp: "رائع يا متدربينا الأفاضل! الإجابة الصحيحة هي الصوت اللفظي للحرف وليس اسمه التقليدي، فهذا هو الأساس المتين للانطلاق في التهجئة السليمة."
},

{
    q: "إذا قمنا بدمج وتركيب أصوات الحروف التالية معاً بشكل متصل: /c/ + /a/ + /t/ فما هي الكلمة الثلاثية الناتجة؟",
    a: [
        "Cat",
        "Car",
        "Ball",
        "Apple"
    ],
    c: 0,
    exp: "أحسنتم يا أبطال المنصة! هذا ما نسميه الدمج الصوتي الثنائي والثلاثي المستهدف في أسبوعنا الثاني للتخلص تماماً من رهبة تجميع الكلمات."
},

{
    q: "أي من الحروف التالية يصدر صوت الانفجار الهوائي الرقيق الشبيه بـ /بـ/ عند البدء في نطق كلمة Ball؟",
    a: [
        "B",
        "S",
        "M",
        "T"
    ],
    c: 0,
    exp: "ممتاز جداً! لقد ميزتم الصوت السمعي الصحيح؛ تدريب المتدربين على التفريق السمعي يبني لديهم مهارة استماع فائقة الجودة."
},

{
    q: "عند رؤية هذه العبارة التأسيسية: (A fat cat)، ما هي الترجمة الصحيحة لمدلول القراءة البصرية المستقلة لها؟",
    a: [
        "قطة سمينة",
        "سيارة حمراء سريعة",
        "تفاحة حمراء لذيّذة",
        "كرة نلعب بها"
    ],
    c: 0,
    exp: "مذهل يا متدربينا الخارقين! قراءتكم الصحيحة للجملة تعني كسر فجوة التردد والبدء في الانطلاق اللغوي المستقل وقراءة القصص."
},

{
    q: "ما هي عائلة الكلمات اللغوية المشتركة التي تنتمي إليها كل من الكلمات التالية: (Cat, Fat, Hat)؟",
    a: [
        "عائلة الصوتيات (-at)",
        "عائلة الصوتيات (-an)",
        "عائلة الصوتيات (-am)",
        "عائلة الصوتيات (-ox)"
    ],
    c: 0,
    exp: "صحيح تماماً! ربط المتدربين للكلمات عبر العوائل الصوتية (Word Families) يضاعف حصيلتهم اللغوية وقدرتهم على التخمين والتهجئة بمفردهم."
}

];

let currentIdx = 0;

let userScore = 0;

const successSound = document.getElementById("successSound");

function playSuccessSound() {

    successSound.pause();

    successSound.currentTime = 0;

    const playPromise = successSound.play();

    if (playPromise !== undefined) {

        playPromise.then(() => {}).catch(() => {});

    }

}

function displayQuestion() {

    if (currentIdx >= questions.length) {

        showFinalResults();

        return;

    }

    const currentQ = questions[currentIdx];

    document.getElementById("question-text").innerText =
        (currentIdx + 1) + ". " + currentQ.q;

    document.getElementById("info-box").style.display = "none";

    document.getElementById("progress-fill").style.width =
        ((currentIdx + 1) / questions.length * 100) + "%";

    const optionsBox = document.getElementById("options-box");

    optionsBox.innerHTML = "";

    currentQ.a.forEach((option, i) => {

        const btn = document.createElement("button");

        btn.className = "option-btn";

        btn.innerText = option;

        btn.onclick = () => validateSelection(i, btn);

        optionsBox.appendChild(btn);

    });

}

function validateSelection(selectedIdx, btn) {

    const correctIdx = questions[currentIdx].c;

    const allBtns = document.querySelectorAll(".option-btn");

    allBtns.forEach(b => b.disabled = true);

    const info = document.getElementById("info-box");

    info.innerText = questions[currentIdx].exp;

    info.style.display = "block";

    if (selectedIdx === correctIdx) {

        btn.classList.add("is-correct");

        playSuccessSound();

        userScore++;

    } else {

        btn.classList.add("is-wrong");

        allBtns[correctIdx].classList.add("is-correct");

    }

    setTimeout(() => {

        currentIdx++;

        displayQuestion();

    }, 4500); // إعطاء المتدربين وقتاً كافياً لقراءة التعليق التعليمي الرائع والموجه لهم

}

function showFinalResults() {

    document.getElementById("quiz-ui").style.display = "none";

    document.getElementById("final-screen").style.display = "block";

    document.getElementById("total-score").innerText =
        userScore + " / " + questions.length;

}

function handleWhatsApp() {

    const name = document.getElementById("user-name").value;

    if (!name) {

        alert("من فضلك اكتب اسم البطل أولاً.");

        return;

    }

    const message = encodeURIComponent(

`مرحباً إدارة منصة البرامج التخصصية،
لقد أتم البطل اختبار تمكين التأسيس بنجاح!

الاسم الثلاثي: ${name}
النتيجة الفنية المحققة: ${userScore} من ${questions.length}

تم الرصد تحت إشراف أستاذ محمد طه عطا المنان.`

    );

    window.open(`https://wa.me/249901946410?text=${message}`);

}

displayQuestion();

</script>

</body>

</html>
