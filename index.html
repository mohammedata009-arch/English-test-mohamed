<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج واجهة تطبيق بنكك - Bankak UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 412px;
            height: 850px;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border-radius: 20px;
        }

        .header {
            background: linear-gradient(135deg, #cc0000 0%, #990000 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header .logo {
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .header .icons span {
            font-size: 18px;
            cursor: pointer;
            margin-left: 15px;
        }

        .welcome-section {
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #222;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 0 15px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .service-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #e60000, #b30000);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(204, 0, 0, 0.3);
            margin-bottom: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .icon-box:active {
            transform: scale(0.95);
            box-shadow: 0 2px 4px rgba(204, 0, 0, 0.3);
        }

        .icon-box svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        .service-title {
            font-size: 13px;
            color: #111;
            font-weight: 500;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="header">
            <span class="icons">&#128276;</span>
            <div class="logo">بنكك bankak</div>
            <span class="icons">&#9201;</span>
        </div>

        <div class="welcome-section">
            مساء الخير، Mohamed Taha
        </div>

        <div class="services-grid">
            <div class="service-card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>
                </div>
                <span class="service-title">تفاصيل الحساب</span>
            </div>

            <div class="service-card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
                </div>
                <span class="service-title">تحويلات</span>
            </div>

            <div class="service-card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                </div>
                <span class="service-title">دفع فواتير</span>
            </div>

            <div class="service-card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 7h18v2H3v-2zm0 7h18v2H3v-2z"/></svg>
                </div>
                <span class="service-title">بنكك PAY</span>
            </div>

            <div class="service-card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                </div>
                <span class="service-title">سحب بدون بطاقة</span>
            </div>

            <div class="service-card">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <span class="service-title">إدارة المستفيدين</span>
            </div>
        </div>
    </div>

</body>
</html>
