<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار عائلتي - محمد طه</title>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #e0f2fe; display: grid; place-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 450px; text-align: center; }
        .btn { display: block; background: #166534; color: white; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; border: none; font-size: 18px; width: 100%; }
    </style>
</head>
<body>

<div class="box" id="quiz">
    <h2 id="q">1. من هو Father؟</h2>
    <div id="btns">
        <button class="btn" onclick="next(true)">الأب</button>
        <button class="btn" onclick="next(false)">الأم</button>
    </div>
</div>

<script>
    let score = 0, i = 0;
    const questions = [
        {q: "1. من هو Father؟", a: true}, {q: "2. من هي Mother؟", a: false},
        {q: "3. كيف ننطق Father؟ (فا-ذر)", a: true}, {q: "4. من هو Brother؟", a: true},
        {q: "5. هل Sister تعني أخت؟", a: true}, {q: "6. من هي Grandmother؟", a: false},
        {q: "7. كيف ننطق Mother؟ (ما-ذر)", a: true}, {q: "8. هل Brother يعني أخ؟", a: true},
        {q: "9. من هو Grandfather؟", a: true}, {q: "10. هل Sister تعني أب؟", a: false}
    ];

    function next(ans) {
        if(ans === questions[i].a) score++;
        i++;
        if(i < questions.length) {
            document.getElementById('q').innerText = questions[i].q;
        } else {
            let name = prompt("انتهى الاختبار! اكتب اسمك ليرسل نتيجتك للمعلم:");
            let msg = `أهلاً معلم محمد طه، الطالب ${name} حصل على ${score} من 10 في اختبار العائلة.`;
            document.getElementById('quiz').innerHTML = 
                `<h2>انتهى الاختبار!</h2><p>نتيجتك: ${score}/10</p>` +
                `<a href="https://wa.me/249901946410?text=${encodeURIComponent(msg)}" class="btn" style="text-decoration:none;">إرسال النتيجة إلى واتساب المعلم</a>`;
        }
    }
</script>
</body>
</html>
